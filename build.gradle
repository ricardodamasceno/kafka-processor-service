buildscript {
    dependencies {
        // PostgreSQL driver and Flyway module used by the plugin tasks (not by the application)
        classpath 'org.postgresql:postgresql:42.7.14'
        classpath 'org.flywaydb:flyway-database-postgresql:13.12.1'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '13.12.1'
}

// Pin Lombok to a release that supports the JDK in use (overrides the Spring Boot managed version).
ext['lombok.version'] = '1.18.48'

group = 'com.event.producer'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    // Redis client (Lettuce) and Spring Data Redis. Nothing uses it yet: this is the base for the first use.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok generates boilerplate (getters, constructors, null checks) at compile time only.
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Flyway: migrations run only when you execute `./gradlew flywayMigrate`.
// The Spring Boot Flyway integration is intentionally NOT a dependency, so the
// application never migrates the database on startup, and nothing here ties migrations
// to other tasks (build, test, bootRun).
// Default values point to the PostgreSQL in docker/docker-compose.yml and can be
// overridden with the DB_URL, DB_USER and DB_PASSWORD environment variables.
flyway {
    url = System.getenv('DB_URL') ?: 'jdbc:postgresql://localhost:5432/events_processor'
    user = System.getenv('DB_USER') ?: 'events'
    password = System.getenv('DB_PASSWORD') ?: 'events'
    locations = ['filesystem:src/main/resources/db/migration']
}
